<!doctype html>
<html>
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@400;500;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap"
  rel="stylesheet"
/>
<style>
  :root {
    --ink: #10214a;
    --ink-soft: #46536f;
    --paper: #eef0ea;
    --chalk: #fbfcfa;
    --rule: #d3d8ce;
    --blunder: #c8362b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 1200px; height: 630px;
    background-color: var(--paper);
    background-image:
      linear-gradient(var(--rule) 1px, transparent 1px),
      linear-gradient(90deg, var(--rule) 1px, transparent 1px);
    background-size: 28px 28px;
    font-family: 'Newsreader', Georgia, serif;
    color: var(--ink);
    overflow: hidden;
  }
  .wrap {
    position: relative;
    width: 1200px; height: 630px;
    padding: 76px 84px;
  }
  .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .mark {
    position: absolute;
    top: 72px;
    right: 84px;
    width: 96px;
    height: 96px;
  }
  h1 {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 800;
    font-size: 128px;
    line-height: 0.9;
    letter-spacing: -0.03em;
    margin: 26px 0 0 0;
  }
  h1 .accent { color: var(--blunder); }
  p.tagline {
    margin-top: 34px;
    max-width: 760px;
    font-size: 30px;
    line-height: 1.35;
    font-style: italic;
    color: var(--ink-soft);
  }
  .footer {
    position: absolute;
    left: 84px;
    right: 84px;
    bottom: 64px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-top: 1px solid rgba(16,33,74,0.25);
    padding-top: 22px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <svg class="mark" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
      <rect width="32" height="32" fill="#10214A"/>
      <rect x="15" y="3" width="2" height="6" fill="#EEF0EA"/>
      <rect x="13" y="5" width="6" height="2" fill="#EEF0EA"/>
      <circle cx="16" cy="12" r="2.4" fill="#EEF0EA"/>
      <polygon points="12,15 20,15 22,19 10,19" fill="#EEF0EA"/>
      <polygon points="11,19 21,19 23,26 9,26" fill="#EEF0EA"/>
      <rect x="7" y="26" width="18" height="3" rx="1" fill="#EEF0EA"/>
      <path d="M23 18 C 25.5 20.3, 25.5 23.2, 23 24.5 C 20.5 23.2, 20.5 20.3, 23 18 Z" fill="#C8362B"/>
    </svg>

    <span class="label">Chess.com weakness report</span>
    <h1>Blund<span class="accent">r</span></h1>
    <p class="tagline">Twenty games, read move by move. One uncomfortable
      truth about your chess, and what to do about it.</p>

    <div class="footer">
      <span class="label">No signup &middot; free &middot; ~30 seconds</span>
      <span class="label">For chess.com players</span>
    </div>
  </div>
</body>
</html>
