name: Bug
description: Something broke, or the report said something wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: >
        The username and time control, if the run itself went wrong — both are
        public on Chess.com. If it failed mid-analysis, the backend log around
        the failure helps a lot.
    validations:
      required: true

  - type: dropdown
    id: how
    attributes:
      label: How are you running it
      options:
        - docker compose up
        - make dev (native)
        - Something else
    validations:
      required: true

  - type: input
    id: provider
    attributes:
      label: Summary provider
      description: >
        `LLM_PROVIDER` and `SUMMARY_MODEL`, or "none" if you haven't set a key.
        Only matters for the closing paragraph.
      placeholder: none
